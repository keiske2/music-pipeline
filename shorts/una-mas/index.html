<!doctype html>
<html
  lang="es"
  data-composition-variables='[{"id":"title","type":"string","label":"Song title","default":"UNA MÁS"},{"id":"subtitle","type":"string","label":"Subtitle","default":"LATIN DANCE WORKOUT"},{"id":"shout","type":"string","label":"Shout line","default":"¡UNA MÁS!"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0b0217;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="bg"
        data-composition-id="bg"
        data-composition-src="compositions/bg.html"
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 0"
      ></div>
      <!-- 댄서 영상: 워크플로가 assets/dancer.mp4를 넣으면 data-hidden을 지워 표시 -->
      <video
        id="dancer"
        class="clip"
        src="assets/dancer.mp4"
        muted
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-hidden
        style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1"
      ></video>
      <div
        id="shade"
        data-composition-id="shade"
        data-composition-src="compositions/shade.html"
        data-no-timeline
        data-start="0"
        data-duration="15"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        data-hidden
        style="z-index: 1"
      ></div>
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="words"
        data-composition-id="words"
        data-composition-src="compositions/words.html"
        data-start="3"
        data-duration="4.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="stack"
        data-composition-id="stack"
        data-composition-src="compositions/stack.html"
        data-start="7.6"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <div
        id="cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="11.6"
        data-duration="3.4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
        style="z-index: 2"
      ></div>
      <audio
        id="song"
        src="assets/music.mp3"
        data-start="0"
        data-duration="15"
        data-fade-in="0.3"
        data-fade-out="1.2"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
